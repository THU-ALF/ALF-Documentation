<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">How Positioning Setup works</title>
  <desc id="d">Printed QR codes are stuck on the real machine. The headset reads the codes and shows the 3D model exactly on top of the real machine.</desc>
  <defs>
    <g id="qr">
      <rect width="26" height="26" fill="#fff" stroke="#14232b" stroke-width="2"/>
      <rect x="4" y="4" width="8" height="8" fill="#14232b"/>
      <rect x="14" y="4" width="8" height="8" fill="#14232b"/>
      <rect x="4" y="14" width="8" height="8" fill="#14232b"/>
      <rect x="15" y="15" width="3" height="3" fill="#14232b"/>
      <rect x="19" y="19" width="3" height="3" fill="#14232b"/>
    </g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2702a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="300" rx="14" fill="#eef3f5"/>

  <!-- Step 1: real machine -->
  <text x="150" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#14232b">1. Real machine</text>
  <g transform="translate(60,70)">
    <rect x="0" y="40" width="180" height="110" rx="6" fill="#c9d3d8" stroke="#5b6f79" stroke-width="2"/>
    <rect x="20" y="0" width="140" height="40" rx="4" fill="#dbe3e7" stroke="#5b6f79" stroke-width="2"/>
    <rect x="12" y="150" width="20" height="14" fill="#5b6f79"/>
    <rect x="148" y="150" width="20" height="14" fill="#5b6f79"/>
    <use href="#qr" x="22" y="70"/>
    <use href="#qr" x="132" y="70"/>
  </g>
  <text x="150" y="268" text-anchor="middle" font-size="14" fill="#3e525c">Printed QR codes stuck on it</text>

  <!-- Arrow -->
  <line x1="275" y1="160" x2="455" y2="160" stroke="#e2702a" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="365" y="145" text-anchor="middle" font-size="14" fill="#3e525c">The headset</text>
  <text x="365" y="185" text-anchor="middle" font-size="14" fill="#3e525c">reads the codes</text>

  <!-- Step 2: headset view -->
  <text x="610" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#14232b">2. In the headset</text>
  <g transform="translate(520,70)">
    <rect x="0" y="40" width="180" height="110" rx="6" fill="#c9d3d8" stroke="#5b6f79" stroke-width="2"/>
    <rect x="20" y="0" width="140" height="40" rx="4" fill="#dbe3e7" stroke="#5b6f79" stroke-width="2"/>
    <rect x="12" y="150" width="20" height="14" fill="#5b6f79"/>
    <rect x="148" y="150" width="20" height="14" fill="#5b6f79"/>
    <use href="#qr" x="22" y="70"/>
    <use href="#qr" x="132" y="70"/>
    <!-- 3D model overlay -->
    <rect x="0" y="40" width="180" height="110" rx="6" fill="#0b6574" fill-opacity="0.35" stroke="#0b6574" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="20" y="0" width="140" height="40" rx="4" fill="#0b6574" fill-opacity="0.35" stroke="#0b6574" stroke-width="3" stroke-dasharray="7 5"/>
    <circle cx="90" cy="95" r="16" fill="#0b6574" fill-opacity="0.55"/>
  </g>
  <text x="610" y="268" text-anchor="middle" font-size="14" fill="#3e525c">The 3D model appears on top of it</text>
</svg>
